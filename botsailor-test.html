<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>اختبار BotSailor | كادر</title>
  <link rel="icon" href="/kader-logo.svg" type="image/svg+xml" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3ea;
      color: #19181a;
      line-height: 1.8;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    .card {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      border: 1px solid #eadfca;
      border-radius: 26px;
      padding: 34px 28px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .badge {
      display: inline-block;
      border: 1px solid #d6a84f;
      color: #b88a32;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 32px;
      line-height: 1.5;
    }

    p {
      margin: 0 auto 18px;
      max-width: 620px;
      font-size: 18px;
    }

    .test-box {
      background: #f7f3ea;
      border: 1px solid #eadfca;
      border-radius: 18px;
      padding: 18px;
      margin-top: 22px;
      text-align: right;
    }

    .test-box strong {
      color: #b88a32;
    }

    .back-link {
      display: inline-block;
      margin-top: 22px;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="badge">اختبار داخلي فقط</div>
      <h1>صفحة اختبار BotSailor لمساعد كادر</h1>
      <p>
        هذه الصفحة مخصصة لاختبار صندوق الدردشة قبل إضافته إلى الصفحة الرئيسية لموقع كادر.
      </p>

      <div class="test-box">
        <p><strong>طريقة الاختبار:</strong></p>
        <p>افتح صندوق الدردشة واكتب: السلام عليكم</p>
        <p>المفروض يظهر رد خدمات كادر باللغة العربية بدون أخطاء.</p>
      </div>

      <a class="back-link" href="/">الرجوع للموقع الرئيسي</a>
    </section>
  </main>

  <script type="text/javascript" src="https://botsailor.com/script/webchat-link.js?code=1790496972330347"></script>
</body>
</html>
